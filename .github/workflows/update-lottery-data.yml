name: Update lottery datasets

on:
  workflow_dispatch:
  schedule:
    # Runs every Sunday at 18:00 UTC.
    # Perth time = Monday 02:00 AWST.
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check scripts
        run: |
          node --check scripts/fetch-lotterywest.mjs
          node --check scripts/fetch-korea-lotto.mjs

      - name: Update Australia Lotterywest data
        run: node scripts/fetch-lotterywest.mjs all

      - name: Update Korea Lotto 6/45 data
        run: node scripts/fetch-korea-lotto.mjs mirror

      - name: Commit updated datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.csv data/*.json

          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Update lottery result datasets"
            git push
          fi
